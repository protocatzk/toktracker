[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__", "static", "templates", "pictures"]

[tool.ruff.lint]
# Bewusste Auswahl: echte Fehler + Hygiene. Modernisierungsregeln (UP0xx) sind
# absichtlich noch deaktiviert, weil sie einen flächendeckenden Umbau bedeuten.
select = ["E", "F", "W", "B", "SIM", "I"]
ignore = [
    "E501",   # Zeilenlänge: Legacy-Code, wird schrittweise angepasst
    "B008",   # FastAPI: Depends()/Query() in Defaults ist idiomatisch
    "SIM105", # try/except/pass ist für Resilienz bewusst gewählt
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]      # Imports nach dem Env-/Config-Load
"services/*/main.py" = ["E402"]
"tests/*" = ["E402", "F401"]  # Bootstrap muss vor App-Imports laufen

[tool.ruff.lint.isort]
known-first-party = ["shared", "services", "app", "config", "database", "schemas", "system_service", "telegram_service", "tiktok_service"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# Ratchet: erst die neuen/gehärteten Module. Weitere Module folgen schrittweise.
files = [
    "shared/ratelimit.py",
    "shared/privacy.py",
    "shared/config.py",
    "shared/db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
