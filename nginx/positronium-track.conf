# ==============================================================================
# Gateway für https://positronium.dev/track
#
# nginx-proxy leitet /track/* an diesen Container weiter (VIRTUAL_PATH=/track).
# Der Original-Pfad bleibt erhalten; die App entfernt das Präfix selbst und
# erzeugt alle Links/Redirects wieder mit /track.
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Uploads (z.B. SQLite-Import) und langsame Admin-Abfragen erlauben.
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /track;

        # Redirects der App sind bereits prefix-aware.
        proxy_redirect off;
    }
}
