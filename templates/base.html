<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1.0{% endblock %}" />
    <base href="{{ request.state.base_path }}/" />
    <meta name="theme-color" content="#0b0e13" id="metaThemeColor" />
    <meta name="color-scheme" content="dark light" />
    <title>{% block title %}{{ brand_name }}{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="pictures/bot_avatar.jpg" />
    <link rel="preload" href="static/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="static/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem("toktracker_theme") || "dark";
                document.documentElement.setAttribute("data-theme", savedTheme);
                var meta = document.getElementById("metaThemeColor");
                if (meta) meta.setAttribute("content", savedTheme === "light" ? "#f2f5f8" : "#0b0e13");
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="static/brand.css?v=2.0.1" />
    {% block styles %}<link rel="stylesheet" href="static/style.css?v=3.0.1" />{% endblock %}
    <script src="static/common.js?v=1.1.0"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
