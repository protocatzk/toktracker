services:
  # ============================================================================
  # 1. Redis Message-Bus & Shared State (Microservices IPC & Leases)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: toktracker_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 1b. Docker Socket Proxy (nur lesende Endpunkte)
  # Der Web-Container fragt Container-/Volume-Metriken über diesen Proxy ab,
  # statt /var/run/docker.sock direkt zu mounten (minimale Rechte).
  # ============================================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: toktracker_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - SYSTEM=1
      - INFO=1
      - VERSION=1
      - PING=1
      # Bewusst deaktiviert: Schreibzugriffe und sensible Bereiche
      - POST=0
      - EXEC=0
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - EVENTS=0
      - SERVICES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - toktracker_net

  # ============================================================================
  # 2. TokTracker Web Dashboard & REST API
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toktracker_app
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "2", "--loop", "uvloop"]
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - SERVICE_ROLE=api
      - REDIS_URL=redis://redis:6379/0
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      # Automatische Konfiguration für Nginx Reverse Proxy & Let's Encrypt
      - VIRTUAL_HOST=${DOMAIN_NAME}
      - VIRTUAL_PORT=5000
      - LETSENCRYPT_HOST=${DOMAIN_NAME}
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
      # Docker-Metriken über den Socket-Proxy (kein direkter Socket-Zugriff nötig)
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ============================================================================
  # 3. TikTokLive Ingest Worker (Horizontal skalierbar per Lease-Sharding)
  # ============================================================================
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "services.ingest.main"]
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=ingest
      - REDIS_URL=redis://redis:6379/0
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.healthcheck", "ingest"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ============================================================================
  # 4. Telegram-Bot Service (Singleton mit Leader-Lock)
  # ============================================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toktracker_bot
    restart: unless-stopped
    command: ["python", "-m", "services.bot.main"]
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=bot
      - REDIS_URL=redis://redis:6379/0
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.healthcheck", "bot"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ============================================================================
  # 5. TokTracker Scheduler (24h-Reports, Disk-Health, DB-Cleanup)
  # ============================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toktracker_scheduler
    restart: unless-stopped
    command: ["python", "-m", "services.scheduler.main"]
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=scheduler
      - REDIS_URL=redis://redis:6379/0
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "python", "-m", "shared.healthcheck", "scheduler"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ============================================================================
  # 6. MariaDB Datenbank (Produktion)
  # ============================================================================
  db:
    image: mariadb:11
    container_name: toktracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me_in_production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toktracker}
      MYSQL_USER: ${MYSQL_USER:-toktracker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-user_change_me_in_production}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - toktracker_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 7. Nginx Reverse Proxy (Öffentlich erreichbar über Port 80 & 443)
  # ============================================================================
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: toktracker_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - toktracker_net
    depends_on:
      - app

  # ============================================================================
  # 8. Let's Encrypt SSL Companion (Automatisches Zertifikat & Auto-Renewal)
  # ============================================================================
  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: toktracker_ssl
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEFAULT_EMAIL=${SSL_EMAIL}
      - NGINX_PROXY_CONTAINER=toktracker_nginx
    networks:
      - toktracker_net
    depends_on:
      - nginx-proxy

networks:
  toktracker_net:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  certs:
    driver: local
  vhost:
    driver: local
  html:
    driver: local
  acme:
    driver: local
