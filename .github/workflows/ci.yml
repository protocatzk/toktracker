name: CI

on:
  push:
    branches: [stream, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mariadb:
        image: mariadb:11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: toktracker
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aktiviert die Redis-Pfade (Bus, Leases, Rate-Limits) in der Testsuite.
      TOKTRACKER_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # MariaDB ist die einzige Engine; die Suite legt pro Lauf eine eigene
      # Test-Datenbank an (tests/_bootstrap.py) und droppt sie wieder.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toktracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (Lint)
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript-Syntax (node --check)
        run: |
          for f in static/*.js; do
            case "$f" in *chart.umd.min.js) continue;; esac
            node --check "$f"
          done

      - name: Mypy (Typen, kuratierter Scope)
        run: mypy

      - name: Tests
        run: pytest
